[package]
name = "batplayer"
version = "0.1.1"
description = "A modern cross-platform media player"
authors = ["BatSoft"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "batplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables the multiwebview API (Window::add_child), which BatPlayer
# uses to attach a transparent webview to an opaque window — see lib.rs.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libmpv2 = "6.0.0"
tauri-plugin-dialog = "2.8.3"
# Single process: a second launch (e.g. "Open with" on another video while
# BatPlayer runs) forwards its command line to the running instance instead
# of opening a bare second player window.
tauri-plugin-single-instance = "2"

# Read more about Tauri's optimization guidelines:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
# Win32_UI_Shell: SetWindowSubclass/DefSubclassProc for the frameless
# drag-resize ring (windows.rs).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Webview transparency (transparent webview over the opaque main window)
# requires this feature on macOS; untested there until Milestone 5 CI.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = [] }
